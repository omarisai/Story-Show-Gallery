<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anuncios Soquel Bilingual</title>
    <link rel="stylesheet" href="dist/ssg.min.css">
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #f6f7f8; color: #111; }
        .main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        h1 { margin-top: 0; }
        .intro { margin-bottom: 1.5rem; line-height: 1.6; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 1rem; }
        .gallery a { display: block; border-radius: 16px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,0.08); background: #fff; text-decoration: none; color: inherit; }
        .gallery img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .caption { padding: 0.85rem 0.9rem 1rem; font-size: 0.95rem; text-align: center; }
        .caption strong { display: block; margin-bottom: 0.45rem; }
        @media (max-width: 600px) { .gallery img { height: 150px; } }
    </style>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
</head>
<body>
    <div class="main">
        <h1>Anuncios Soquel Bilingual</h1>
        <p class="intro">This page loads images from the local <code>images/</code> folder. Click a thumbnail to open the Story Show Gallery lightbox.</p>
        <section class="ssg fs vipssg ssgdim gallery">
            <a href="images/con%20personas.png" data-author="Local image">
                <img src="images/con%20personas.png" alt="con personas">
            </a>
            <a href="images/Dia%20del%20aventurero.jpeg" data-author="Local image">
                <img src="images/Dia%20del%20aventurero.jpeg" alt="Dia del aventurero">
            </a>
            <a href="images/faciales.jpeg" data-author="Local image">
                <img src="images/faciales.jpeg" alt="faciales">
            </a>
            <a href="images/MinisterioDeDamas.png" data-author="Local image">
                <img src="images/MinisterioDeDamas.png" alt="MinisterioDeDamas">
            </a>
            <a href="images/retiro_damas.jpeg" data-author="Local image">
                <img src="images/retiro_damas.jpeg" alt="retiro_damas">
            </a>
            <a href="images/retiro_matrimonios.jpeg" data-author="Local image">
                <img src="images/retiro_matrimonios.jpeg" alt="retiro matrimonios">
            </a>
            <a href="images/VHM-constituency.png" data-author="Local image">
                <img src="images/VHM-constituency.png" alt="VHM constituency">
            </a>
        </section>
    </div>
    <script src="dist/ssg.min.js"></script>
</body>
</html>
