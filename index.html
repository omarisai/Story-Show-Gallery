<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anuncios Soquel Bilingual</title>
    <link rel="stylesheet" href="dist/ssg.min.css">
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #f6f7f8; color: #111; }
        .main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        h1 { margin-top: 0; }
        .intro { margin-bottom: 1.5rem; line-height: 1.6; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 1rem; }
        .gallery a { display: block; border-radius: 16px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,0.08); background: #fff; text-decoration: none; color: inherit; }
        .gallery img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .caption { padding: 0.85rem 0.9rem 1rem; font-size: 0.95rem; text-align: center; }
        .caption strong { display: block; margin-bottom: 0.45rem; }
        @media (max-width: 600px) { .gallery img { height: 150px; } }
    </style>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
</head>
<body>
    <div class="main">
        <h1>Anuncios Soquel Bilingual</h1>
        <section class="ssg fs vipssg ssgdim gallery">
            <a href="images/Club de lectura.png" data-author="Local image">
                <img src="images/Club de lectura.png" alt="Club de lectura">
            </a>
            <a href="images/Constituency meeting VHM.png" data-author="Local image">
                <img src="images/Constituency meeting VHM.png" alt="Constituency meeting VHM">
            </a>
            <a href="images/Dia del aventurero.jpeg" data-author="Local image">
                <img src="images/Dia del aventurero.jpeg" alt="Dia del aventurero">
            </a>
            <a href="images/Evento Pop-up en VHM.png" data-author="Local image">
                <img src="images/Evento Pop-up en VHM.png" alt="Evento Pop-up en VHM">
            </a>
            <a href="images/Faciales gratuitos.jpeg" data-author="Local image">
                <img src="images/Faciales gratuitos.jpeg" alt="Faciales gratuitos">
            </a>
            <a href="images/Ministerio de Damas.png" data-author="Local image">
                <img src="images/Ministerio de Damas.png" alt="Ministerio de Damas">
            </a>
            <a href="images/Retiro de Damas.jpeg" data-author="Local image">
                <img src="images/Retiro de Damas.jpeg" alt="Retiro de Damas">
            </a>
            <a href="images/Retiro de maatrimonios.jpeg" data-author="Local image">
                <img src="images/Retiro de maatrimonios.jpeg" alt="Retiro de maatrimonios">
            </a>
            <a href="images/comida_damas.png" data-author="Local image">
                <img src="images/comida_damas.png" alt="comida damas">
            </a>
        </section>
    </div>
    <script src="dist/ssg.min.js"></script>
</body>
</html>
