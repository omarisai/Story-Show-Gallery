name: Build and Publish Docker image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags:
            - ghcr.io/${{ github.repository_owner }}/story-show-gallery:latest
            - ghcr.io/${{ github.repository_owner }}/story-show-gallery:${{ github.sha }}
          build-args:
            NODE_ENV: production

      - name: Output published image
        run: echo "Docker image published: ghcr.io/${{ github.repository_owner }}/story-show-gallery:latest"
